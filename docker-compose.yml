services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: logx-backend:latest
    container_name: logx-backend
    ports:
      - "8000:8000"
    volumes:
      - logx-data:/data
    environment:
      LOGX_DATABASE_URL: sqlite:////data/logx.db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    image: logx-frontend:latest
    container_name: logx-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  logx-data:
    name: logx-data
    external: true